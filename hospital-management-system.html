<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CarePoint | Hospital Management System</title>
<style>
:root{--navy:#15324b;--blue:#2563eb;--teal:#0d9488;--bg:#f4f7fb;--text:#172b3a;--muted:#6b7c8f;--line:#e4ebf2;--white:#fff;--red:#dc2626;--amber:#d97706}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.sidebar{background:var(--navy);color:white;padding:24px 16px;display:flex;flex-direction:column;gap:24px}.brand{display:flex;align-items:center;gap:10px;padding:0 10px;font-size:21px;font-weight:800}.brandmark{width:38px;height:38px;border-radius:12px;background:#14b8a6;display:grid;place-items:center;font-size:25px}.side-label{font-size:11px;letter-spacing:1.4px;color:#a9bdcf;padding:0 12px;margin:4px 0}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#d7e3ed;text-align:left;padding:12px;border-radius:10px;display:flex;gap:12px;align-items:center;font-size:14px}.nav button.active,.nav button:hover{background:#284a65;color:white}.nav .ico{width:20px;text-align:center;font-size:17px}.side-foot{margin-top:auto;background:#21435d;border-radius:13px;padding:15px;font-size:12px;color:#d3e1eb;line-height:1.5}.main{min-width:0}.topbar{height:78px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;gap:18px}.crumb{font-size:13px;color:var(--muted)}.top-title{font-weight:750;font-size:20px;margin-top:4px}.top-right{display:flex;align-items:center;gap:14px}.search{border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:220px}.avatar{width:38px;height:38px;border-radius:50%;background:#dbeafe;color:#1d4ed8;display:grid;place-items:center;font-weight:800}.content{padding:28px 30px;max-width:1600px;margin:auto}.welcome{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}.welcome h1{margin:0 0 7px;font-size:26px}.welcome p{margin:0;color:var(--muted);font-size:14px}.btn{border:0;border-radius:9px;padding:11px 15px;background:var(--blue);color:white;font-weight:650;font-size:13px}.btn:hover{filter:brightness(.95)}.btn.secondary{background:white;border:1px solid var(--line);color:var(--text)}.btn.teal{background:var(--teal)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:22px}.stat{background:white;border:1px solid var(--line);border-radius:14px;padding:19px;display:flex;justify-content:space-between;gap:10px}.stat .label{color:var(--muted);font-size:13px}.stat .number{font-size:27px;font-weight:800;margin:9px 0 6px}.trend{font-size:12px;color:var(--teal)}.stat-icon{height:44px;width:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:#eaf2ff}.stat:nth-child(2) .stat-icon{background:#e3faf5}.stat:nth-child(3) .stat-icon{background:#fff3df}.stat:nth-child(4) .stat-icon{background:#f4eaff}.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:20px;min-width:0}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.panel h2{font-size:17px;margin:0}.panel-sub{font-size:12px;color:var(--muted);margin-top:5px}.grid-two{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;color:var(--muted);font-weight:650;font-size:11px;letter-spacing:.4px;padding:12px 10px;border-bottom:1px solid var(--line)}td{padding:14px 10px;border-bottom:1px solid #edf1f5;font-size:13px}tbody tr:last-child td{border-bottom:0}.person{display:flex;align-items:center;gap:10px}.mini-avatar{height:34px;width:34px;border-radius:10px;background:#eaf2ff;display:grid;place-items:center;color:#2458a8;font-weight:800}.person small{display:block;color:var(--muted);margin-top:4px}.pill{display:inline-block;border-radius:99px;padding:5px 9px;font-size:11px;font-weight:700;background:#e5f8ef;color:#087443}.pill.pending{background:#fff3d9;color:#9a5b00}.pill.cancelled{background:#fee2e2;color:#b91c1c}.pill.info{background:#e5edff;color:#2458a8}.appointment{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid #edf1f5}.appointment:last-child{border:0}.timebox{background:#edf5ff;color:#2458a8;border-radius:10px;padding:9px 8px;min-width:62px;text-align:center;font-size:12px;font-weight:750}.appointment strong{font-size:13px}.appointment p{margin:5px 0;color:var(--muted);font-size:12px}.page-head{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:20px}.page-head h1{font-size:25px;margin:0 0 6px}.page-head p{color:var(--muted);margin:0;font-size:13px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.toolbar input,.toolbar select{padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:white;min-width:180px}.empty{text-align:center;color:var(--muted);padding:35px}.actions{display:flex;gap:6px}.small-btn{background:white;border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-size:12px}.room-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.room{border:1px solid var(--line);border-radius:12px;padding:16px}.room h3{margin:0 0 7px;font-size:15px}.room p{margin:0 0 13px;font-size:12px;color:var(--muted)}.room .bedline{height:7px;background:#edf1f5;border-radius:8px;overflow:hidden;margin:12px 0}.room .bedline span{display:block;height:100%;background:var(--teal);border-radius:8px}.modal-backdrop{position:fixed;inset:0;background:#0f2238a6;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal-backdrop.show{display:flex}.modal{width:min(600px,100%);max-height:90vh;overflow:auto;background:white;border-radius:16px;padding:24px;box-shadow:0 20px 60px #0002}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.modal-head h2{margin:0;font-size:20px}.close{border:0;background:#f1f5f9;border-radius:8px;width:34px;height:34px;font-size:20px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:700;color:#4b5d70}.field input,.field select,.field textarea{width:100%;border:1px solid #dbe4ec;border-radius:9px;padding:11px;background:white;min-width:0}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}.notice{font-size:12px;color:var(--muted);line-height:1.5;margin-top:14px}.toast{position:fixed;right:22px;bottom:22px;background:#123c34;color:white;padding:13px 18px;border-radius:10px;box-shadow:0 10px 30px #0002;display:none;z-index:20;font-size:13px}.toast.show{display:block}.chart{display:flex;align-items:flex-end;gap:12px;height:150px;padding:12px 4px 0}.bar-col{height:100%;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px}.bar{width:min(32px,70%);background:#93c5fd;border-radius:7px 7px 2px 2px;min-height:5px}.bar.current{background:var(--blue)}.bar-col small{font-size:11px;color:var(--muted)}.chart-note{font-size:12px;color:var(--muted);margin-top:8px}
@media(max-width:1100px){.stats{grid-template-columns:repeat(2,1fr)}.grid-two{grid-template-columns:1fr}.room-grid{grid-template-columns:repeat(2,1fr)}.search{width:160px}}
@media(max-width:700px){.app{grid-template-columns:1fr}.sidebar{padding:12px;gap:12px}.brand{padding:0 6px}.side-label,.side-foot{display:none}.nav{display:flex;overflow-x:auto}.nav button{white-space:nowrap;padding:10px}.topbar{height:auto;padding:15px;align-items:flex-start}.top-title{font-size:17px}.search{display:none}.content{padding:18px 14px}.welcome{align-items:flex-start;flex-direction:column}.stats{gap:10px}.stat{padding:14px}.stat .number{font-size:23px}.room-grid{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.page-head{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="brandmark">✚</div><span>CarePoint</span></div>
  <div><div class="side-label">WORKSPACE</div><nav class="nav" id="nav">
    <button class="active" data-page="dashboard"><span class="ico">▦</span>Dashboard</button>
    <button data-page="patients"><span class="ico">♙</span>Patients</button>
    <button data-page="doctors"><span class="ico">⚕</span>Doctors</button>
    <button data-page="appointments"><span class="ico">▣</span>Appointments</button>
    <button data-page="rooms"><span class="ico">▤</span>Rooms & Beds</button>
    <button data-page="billing"><span class="ico">₹</span>Billing</button>
  </nav></div>
  <div><div class="side-label">SYSTEM</div><nav class="nav"><button data-page="reports"><span class="ico">▥</span>Reports</button></nav></div>
  <div class="side-foot"><strong>CarePoint HMS</strong><br>Hospital operations made simpler.<br><span style="opacity:.7">Demo version · Browser storage</span></div>
</aside>
<main class="main">
  <header class="topbar"><div><div class="crumb">CarePoint / <span id="crumb">Overview</span></div><div class="top-title" id="topTitle">Hospital Dashboard</div></div><div class="top-right"><input class="search" id="globalSearch" placeholder="Search records..." aria-label="Search records"><div class="avatar">AD</div></div></header>
  <section class="content" id="content"></section>
</main>
</div>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal"><div class="modal-head"><h2 id="modalTitle">Add record</h2><button class="close" id="closeModal" aria-label="Close">×</button></div><form id="recordForm"><div class="form-grid" id="formFields"></div><div class="modal-actions"><button type="button" class="btn secondary" id="cancelModal">Cancel</button><button type="submit" class="btn">Save record</button></div></form></div></div>
<div class="toast" id="toast"></div>
<script>
const seed={
patients:[
{id:'PT-1001',name:'Aarav Sharma',age:34,gender:'Male',phone:'9876543210',blood:'B+',condition:'General checkup',status:'Active'},
{id:'PT-1002',name:'Diya Patel',age:28,gender:'Female',phone:'9876501234',blood:'O+',condition:'Migraine',status:'Active'},
{id:'PT-1003',name:'Rohan Kumar',age:52,gender:'Male',phone:'9845012345',blood:'A+',condition:'Diabetes follow-up',status:'Admitted'},
{id:'PT-1004',name:'Meera Iyer',age:41,gender:'Female',phone:'9894012345',blood:'AB+',condition:'Orthopaedic review',status:'Active'}
],
doctors:[
{id:'DR-201',name:'Dr. Ananya Rao',specialty:'Cardiology',phone:'9876100001',email:'ananya@carepoint.demo',status:'Available'},
{id:'DR-202',name:'Dr. Vikram Singh',specialty:'Neurology',phone:'9876100002',email:'vikram@carepoint.demo',status:'Available'},
{id:'DR-203',name:'Dr. Priya Nair',specialty:'Paediatrics',phone:'9876100003',email:'priya@carepoint.demo',status:'On Leave'},
{id:'DR-204',name:'Dr. Arjun Das',specialty:'Orthopaedics',phone:'9876100004',email:'arjun@carepoint.demo',status:'Available'}
],
appointments:[
{id:'AP-301',patient:'Aarav Sharma',doctor:'Dr. Ananya Rao',date:today(),time:'09:30',reason:'Routine checkup',status:'Confirmed'},
{id:'AP-302',patient:'Diya Patel',doctor:'Dr. Vikram Singh',date:today(),time:'10:15',reason:'Headache review',status:'Waiting'},
{id:'AP-303',patient:'Rohan Kumar',doctor:'Dr. Ananya Rao',date:today(),time:'11:00',reason:'Diabetes follow-up',status:'Confirmed'},
{id:'AP-304',patient:'Meera Iyer',doctor:'Dr. Arjun Das',date:tomorrow(),time:'14:30',reason:'Knee pain review',status:'Confirmed'}
],
rooms:[
{id:'RM-101',type:'General Ward',beds:8,occupied:5,floor:'1st Floor'},
{id:'RM-201',type:'Private Room',beds:4,occupied:3,floor:'2nd Floor'},
{id:'RM-301',type:'ICU',beds:6,occupied:4,floor:'3rd Floor'},
{id:'RM-401',type:'Maternity',beds:5,occupied:2,floor:'4th Floor'}
],
billing:[
{id:'BL-501',patient:'Aarav Sharma',date:today(),description:'Consultation fee',amount:800,status:'Paid'},
{id:'BL-502',patient:'Rohan Kumar',date:today(),description:'Lab tests and consultation',amount:2450,status:'Pending'},
{id:'BL-503',patient:'Diya Patel',date:yesterday(),description:'Neurology consultation',amount:1200,status:'Paid'}
]};
function today(){return new Date().toISOString().slice(0,10)}
function tomorrow(){let d=new Date();d.setDate(d.getDate()+1);return d.toISOString().slice(0,10)}
function yesterday(){let d=new Date();d.setDate(d.getDate()-1);return d.toISOString().slice(0,10)}
let db={};try{db=JSON.parse(localStorage.getItem('carepoint_db'))||{}}catch(e){}
Object.keys(seed).forEach(k=>{if(!Array.isArray(db[k]))db[k]=seed[k]});
function save(){localStorage.setItem('carepoint_db',JSON.stringify(db))}
save();
let currentPage='dashboard', searchTerm='', modalType='', editingId=null;
const config={
patients:{title:'Patients',singular:'Patient',prefix:'PT',fields:[
['name','Full name','text',true],['age','Age','number',true],['gender','Gender','select',true,['Male','Female','Other']],['phone','Phone number','tel',true],['blood','Blood group','select',false,['A+','A-','B+','B-','AB+','AB-','O+','O-']],['condition','Reason for visit / condition','text',false],['status','Status','select',true,['Active','Admitted','Discharged']]]},
doctors:{title:'Doctors',singular:'Doctor',prefix:'DR',fields:[
['name','Doctor name','text',true],['specialty','Speciality','select',true,['Cardiology','Neurology','Paediatrics','Orthopaedics','Dermatology','General Medicine','Gynaecology','Emergency']],['phone','Phone number','tel',true],['email','Email address','email',false],['status','Availability','select',true,['Available','On Leave','Unavailable']]]},
appointments:{title:'Appointments',singular:'Appointment',prefix:'AP',fields:[
['patient','Patient name','select',true,[]],['doctor','Doctor name','select',true,[]],['date','Appointment date','date',true],['time','Time','time',true],['reason','Reason','text',false],['status','Status','select',true,['Confirmed','Waiting','Completed','Cancelled']]]},
billing:{title:'Billing',singular:'Bill',prefix:'BL',fields:[
['patient','Patient name','select',true,[]],['date','Bill date','date',true],['description','Description','text',true],['amount','Amount (₹)','number',true],['status','Payment status','select',true,['Paid','Pending','Waived']]]}
};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n){return '₹'+Number(n||0).toLocaleString('en-IN')}
function initials(n){return String(n||'?').split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase()}
function pill(s){let cls=['Waiting','Pending','On Leave','Unavailable'].includes(s)?'pending':['Cancelled','Discharged'].includes(s)?'cancelled':['Confirmed','Available','Active','Paid','Completed'].includes(s)?'':'info';return `<span class="pill ${cls}">${esc(s)}</span>`}
function dateFmt(d){if(!d)return '—';return new Date(d+'T00:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})}
function setPage(p){currentPage=p;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.getElementById('crumb').textContent=p==='dashboard'?'Overview':config[p]?.title||p[0].toUpperCase()+p.slice(1);document.getElementById('topTitle').textContent=p==='dashboard'?'Hospital Dashboard':config[p]?.title||p[0].toUpperCase()+p.slice(1);render()}
document.getElementById('nav').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b)setPage(b.dataset.page)});
document.querySelector('[data-page="reports"]').addEventListener('click',()=>setPage('reports'));
document.getElementById('globalSearch').addEventListener('input',e=>{searchTerm=e.target.value.toLowerCase();render()});
function matches(o){return !searchTerm||Object.values(o).some(v=>String(v).toLowerCase().includes(searchTerm))}
function render(){let root=document.getElementById('content');if(currentPage==='dashboard')root.innerHTML=dashboard();else if(currentPage==='rooms')root.innerHTML=roomsPage();else if(currentPage==='reports')root.innerHTML=reportsPage();else root.innerHTML=tablePage(currentPage);wireActions()}
function dashboard(){
let ap=db.appointments.filter(a=>a.date===today()&&a.status!=='Cancelled');
let paid=db.billing.filter(b=>b.status==='Paid').reduce((s,b)=>s+Number(b.amount),0);
return `<div class="welcome"><div><h1>Good morning, Admin 👋</h1><p>Here's what's happening at your hospital today.</p></div><button class="btn" data-add="appointments">＋ New appointment</button></div>
<div class="stats">
<div class="stat"><div><div class="label">Total patients</div><div class="number">${db.patients.length}</div><div class="trend">● Registered patients</div></div><div class="stat-icon">♙</div></div>
<div class="stat"><div><div class="label">Appointments today</div><div class="number">${ap.length}</div><div class="trend">● ${ap.filter(a=>a.status==='Waiting').length} waiting</div></div><div class="stat-icon">▣</div></div>
<div class="stat"><div><div class="label">Available doctors</div><div class="number">${db.doctors.filter(d=>d.status==='Available').length}</div><div class="trend">● On duty</div></div><div class="stat-icon">⚕</div></div>
<div class="stat"><div><div class="label">Paid bills total</div><div class="number" style="font-size:24px">${money(paid)}</div><div class="trend">● Recorded payments</div></div><div class="stat-icon">₹</div></div></div>
<div class="grid-two"><div class="panel"><div class="panel-head"><div><h2>Recent patients</h2><div class="panel-sub">Latest patient records</div></div><button class="btn secondary" data-goto="patients">View all</button></div>${patientTable(db.patients.slice(-4).reverse())}</div>
<div class="panel"><div class="panel-head"><div><h2>Today's appointments</h2><div class="panel-sub">${dateFmt(today())}</div></div><button class="btn secondary" data-goto="appointments">View all</button></div>${ap.length?ap.map(a=>`<div class="appointment"><div class="timebox">${esc(a.time)}</div><div><strong>${esc(a.patient)}</strong><p>${esc(a.doctor)} · ${esc(a.reason||'Consultation')}</p>${pill(a.status)}</div></div>`).join(''):'<div class="empty">No appointments scheduled for today.</div>'}</div></div>
<div class="grid-two"><div class="panel"><div class="panel-head"><div><h2>Weekly patient visits</h2><div class="panel-sub">Illustrative activity overview</div></div></div><div class="chart">${[['Mon',35],['Tue',55],['Wed',42],['Thu',72],['Fri',61],['Sat',88],['Sun',48]].map((x,i)=>`<div class="bar-col"><div class="bar ${i===5?'current':''}" style="height:${x[1]}%"></div><small>${x[0]}</small></div>`).join('')}</div><div class="chart-note">Sample chart for demonstration; connect real data for accurate reporting.</div></div>
<div class="panel"><div class="panel-head"><div><h2>Room occupancy</h2><div class="panel-sub">Current bed availability</div></div><button class="btn secondary" data-goto="rooms">Manage rooms</button></div>${db.rooms.map(r=>`<div style="margin:15px 0"><div style="display:flex;justify-content:space-between;font-size:13px"><strong>${esc(r.type)}</strong><span style="color:var(--muted)">${r.occupied}/${r.beds} beds</span></div><div class="room bedline"><span style="width:${Math.min(100,r.occupied/r.beds*100)}%"></span></div></div>`).join('')}</div></div>`;
}
function patientTable(list){return `<div class="table-wrap"><table><thead><tr><th>PATIENT</th><th>ID</th><th>CONDITION</th><th>STATUS</th></tr></thead><tbody>${list.map(p=>`<tr><td><div class="person"><div class="mini-avatar">${initials(p.name)}</div><div><strong>${esc(p.name)}</strong><small>${esc(p.age)} yrs · ${esc(p.gender)}</small></div></div></td><td>${esc(p.id)}</td><td>${esc(p.condition||'—')}</td><td>${pill(p.status)}</td></tr>`).join('')}</tbody></table></div>`}
function tablePage(type){let c=config[type],list=db[type].filter(matches);return `<div class="page-head"><div><h1>${c.title}</h1><p>Manage and review ${c.title.toLowerCase()} records.</p></div><button class="btn" data-add="${type}">＋ Add ${c.singular.toLowerCase()}</button></div><div class="panel"><div class="toolbar"><input id="localSearch" placeholder="Filter ${c.title.toLowerCase()}..." value="${esc(searchTerm)}"><select id="statusFilter"><option value="">All statuses</option>${(type==='patients'?['Active','Admitted','Discharged']:type==='doctors'?['Available','On Leave','Unavailable']:type==='appointments'?['Confirmed','Waiting','Completed','Cancelled']:['Paid','Pending','Waived']).map(s=>`<option>${s}</option>`).join('')}</select></div><div id="tableArea">${renderDataTable(type,list)}</div></div>`}
function renderDataTable(type,list){if(!list.length)return '<div class="empty">No records found. Add a record to get started.</div>';let cols={patients:[['name','Patient'],['id','Patient ID'],['age','Age'],['phone','Phone'],['condition','Condition'],['status','Status']],doctors:[['name','Doctor'],['id','Doctor ID'],['specialty','Speciality'],['phone','Phone'],['email','Email'],['status','Availability']],appointments:[['patient','Patient'],['doctor','Doctor'],['date','Date'],['time','Time'],['reason','Reason'],['status','Status']],billing:[['id','Bill ID'],['patient','Patient'],['date','Date'],['description','Description'],['amount','Amount'],['status','Payment']]}[type];return `<div class="table-wrap"><table><thead><tr>${cols.map(c=>`<th>${c[1].toUpperCase()}</th>`).join('')}<th>ACTIONS</th></tr></thead><tbody>${list.map(o=>`<tr>${cols.map(([k])=>`<td>${k==='status'?pill(o[k]):k==='date'?dateFmt(o[k]):k==='amount'?money(o[k]):k==='name'?`<div class="person"><div class="mini-avatar">${initials(o[k])}</div><strong>${esc(o[k])}</strong></div>`:esc(o[k]||'—')}</td>`).join('')}<td><div class="actions"><button class="small-btn" data-edit="${type}" data-id="${esc(o.id)}">Edit</button><button class="small-btn" data-delete="${type}" data-id="${esc(o.id)}" aria-label="Delete ${esc(o.id)}">Delete</button></div></td></tr>`).join('')}</tbody></table></div>`}
function roomsPage(){return `<div class="page-head"><div><h1>Rooms & Beds</h1><p>Monitor bed capacity and room occupancy.</p></div><button class="btn" data-add="room">＋ Add room</button></div><div class="stats"><div class="stat"><div><div class="label">Total beds</div><div class="number">${db.rooms.reduce((s,r)=>s+Number(r.beds),0)}</div></div><div class="stat-icon">▤</div></div><div class="stat"><div><div class="label">Occupied beds</div><div class="number">${db.rooms.reduce((s,r)=>s+Number(r.occupied),0)}</div></div><div class="stat-icon">🛏</div></div><div class="stat"><div><div class="label">Available beds</div><div class="number">${db.rooms.reduce((s,r)=>s+Number(r.beds-r.occupied),0)}</div></div><div class="stat-icon">✓</div></div><div class="stat"><div><div class="label">Room categories</div><div class="number">${db.rooms.length}</div></div><div class="stat-icon">▦</div></div></div><div class="panel"><div class="panel-head"><h2>Room overview</h2><span class="panel-sub">Occupancy by ward</span></div><div class="room-grid">${db.rooms.map(r=>`<div class="room"><div style="display:flex;justify-content:space-between;gap:8px"><h3>${esc(r.type)}</h3>${pill(r.occupied<r.beds?'Available':'Full')}</div><p>${esc(r.id)} · ${esc(r.floor)}</p><div style="font-size:13px"><strong>${r.occupied}</strong> occupied / ${r.beds} beds</div><div class="bedline"><span style="width:${Math.min(100,r.occupied/r.beds*100)}%;background:${r.occupied===r.beds?'#dc2626':'var(--teal)'}"></span></div><div style="display:flex;justify-content:space-between;align-items:center"><small style="color:var(--muted)">${r.beds-r.occupied} available</small><button class="small-btn" data-edit="room" data-id="${esc(r.id)}">Edit</button></div></div>`).join('')}</div></div>`}
function reportsPage(){let paid=db.billing.filter(b=>b.status==='Paid').reduce((s,b)=>s+Number(b.amount),0),pending=db.billing.filter(b=>b.status==='Pending').reduce((s,b)=>s+Number(b.amount),0);return `<div class="page-head"><div><h1>Reports</h1><p>A quick summary of the data currently stored in this demo.</p></div><button class="btn" id="exportBtn">⇩ Export CSV</button></div><div class="stats"><div class="stat"><div><div class="label">Registered patients</div><div class="number">${db.patients.length}</div></div><div class="stat-icon">♙</div></div><div class="stat"><div><div class="label">Appointments</div><div class="number">${db.appointments.length}</div></div><div class="stat-icon">▣</div></div><div class="stat"><div><div class="label">Paid revenue</div><div class="number" style="font-size:24px">${money(paid)}</div></div><div class="stat-icon">₹</div></div><div class="stat"><div><div class="label">Outstanding bills</div><div class="number" style="font-size:24px">${money(pending)}</div></div><div class="stat-icon">◷</div></div></div><div class="panel"><h2>Department & operations summary</h2><div class="table-wrap" style="margin-top:15px"><table><thead><tr><th>METRIC</th><th>COUNT / VALUE</th></tr></thead><tbody><tr><td>Active patients</td><td>${db.patients.filter(p=>p.status==='Active').length}</td></tr><tr><td>Admitted patients</td><td>${db.patients.filter(p=>p.status==='Admitted').length}</td></tr><tr><td>Available doctors</td><td>${db.doctors.filter(d=>d.status==='Available').length}</td></tr><tr><td>Confirmed appointments</td><td>${db.appointments.filter(a=>a.status==='Confirmed').length}</td></tr><tr><td>Paid billing total</td><td>${money(paid)}</td></tr><tr><td>Pending billing total</td><td>${money(pending)}</td></tr></tbody></table></div><p class="notice">This is a demonstration application. Do not use it to store real patient information or make clinical decisions.</p></div>`}
function wireActions(){
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>openModal(b.dataset.add));
document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>setPage(b.dataset.goto));
document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openModal(b.dataset.edit,b.dataset.id));
document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteRecord(b.dataset.delete,b.dataset.id));
let ls=document.getElementById('localSearch');if(ls)ls.oninput=()=>{searchTerm=ls.value.toLowerCase();let list=db[currentPage].filter(matches);document.getElementById('tableArea').innerHTML=renderDataTable(currentPage,list);wireActions()};
let sf=document.getElementById('statusFilter');if(sf)sf.onchange=()=>{let list=db[currentPage].filter(o=>matches(o)&&(!sf.value||o.status===sf.value));document.getElementById('tableArea').innerHTML=renderDataTable(currentPage,list);wireActions()};
let ex=document.getElementById('exportBtn');if(ex)ex.onclick=exportCSV;
}
function openModal(type,id=null){modalType=type;editingId=id;let room=type==='room';let c=room?{title:'Room',singular:'Room',prefix:'RM',fields:[['id','Room ID','text',true],['type','Room type','select',true,['General Ward','Private Room','ICU','Maternity','Emergency']],['beds','Total beds','number',true],['occupied','Occupied beds','number',true],['floor','Floor','text',true]]}:config[type];if(!c)return;let old=id?(room?db.rooms:db[type]).find(o=>o.id===id):{};document.getElementById('modalTitle').textContent=(id?'Edit ':'Add ')+c.singular;document.getElementById('formFields').innerHTML=c.fields.map(([key,label,inputType,required,options])=>{let opts=options;if(key==='patient')opts=db.patients.map(p=>p.name);if(key==='doctor')opts=db.doctors.map(d=>d.name);let val=old?.[key]??(key==='date'?today():key==='status'?(type==='appointments'?'Confirmed':type==='billing'?'Pending':type==='patients'?'Active':'Available'):'');if(inputType==='select')return `<div class="field"><label>${label}${required?' *':''}</label><select name="${key}" ${required?'required':''}>${!required?'<option value="">Select...</option>':''}${(opts||[]).map(v=>`<option ${String(v)===String(val)?'selected':''}>${esc(v)}</option>`).join('')}</select></div>`;return `<div class="field ${key==='condition'||key==='description'?'full':''}"><label>${label}${required?' *':''}</label><input name="${key}" type="${inputType}" value="${esc(val)}" ${required?'required':''} ${inputType==='number'?'min="0"':''} ${key==='id'&&id?'readonly':''}></div>`}).join('');document.getElementById('modalBackdrop').classList.add('show')}
function closeModal(){document.getElementById('modalBackdrop').classList.remove('show')}
document.getElementById('closeModal').onclick=closeModal;document.getElementById('cancelModal').onclick=closeModal;document.getElementById('modalBackdrop').onclick=e=>{if(e.target.id==='modalBackdrop')closeModal()};
document.getElementById('recordForm').onsubmit=e=>{e.preventDefault();let room=modalType==='room',c=room?{prefix:'RM'}:config[modalType],data=Object.fromEntries(new FormData(e.target).entries());if(room){data.beds=Number(data.beds);data.occupied=Number(data.occupied);if(data.occupied>data.beds){notify('Occupied beds cannot exceed total beds.');return}}if(modalType==='patients')data.age=Number(data.age);if(modalType==='billing')data.amount=Number(data.amount);let list=room?db.rooms:db[modalType];if(editingId){let i=list.findIndex(o=>o.id===editingId);if(i>=0)list[i]={...list[i],...data,id:editingId}}else{data.id=data.id||c.prefix+'-'+(Date.now().toString().slice(-6));list.unshift(data)}save();closeModal();notify((editingId?'Updated ':'Added ')+(room?'room':c.singular.toLowerCase())+' successfully.');render()};
function deleteRecord(type,id){if(!confirm('Delete record '+id+'? This cannot be undone.'))return;let list=type==='room'?db.rooms:db[type];let i=list.findIndex(o=>o.id===id);if(i>=0)list.splice(i,1);save();notify('Record deleted.');render()}
function notify(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800)}
function exportCSV(){let rows=[['ID','Name / Patient','Date','Details','Amount','Status'],...db.billing.map(b=>[b.id,b.patient,b.date,b.description,b.amount,b.status])];let csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='carepoint-billing-report.csv';a.click();URL.revokeObjectURL(a.href);notify('CSV report exported.')}
render();
</script>
</body>
</html>
